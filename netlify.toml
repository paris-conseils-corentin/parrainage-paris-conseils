# Configuration Netlify — site parrainage Paris Conseils
# v284 — surveillance quotidienne (parrainage-healthcheck) + cache HTML court

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ==== Surveillance : contrôle quotidien du formulaire, de la base et de la messagerie ====
# 07:00 UTC = 9h (heure de Paris en été). Mail d'alerte uniquement si problème + un « OK » le lundi.
[functions."parrainage-healthcheck"]
  schedule = "0 7 * * *"

# ==== Sécurité globale ====
# v297 — Le site reçoit des coordonnées personnelles et bancaires : on verrouille
# le navigateur du visiteur, en plus du chiffrement HTTPS déjà en place.
#   HSTS ................ interdit toute connexion en clair, y compris à la
#                         première frappe de l'adresse (un an, sous-domaines inclus).
#   CSP ................. la page ne peut charger de code, de police ou d'image
#                         que depuis les quelques sources listées ici : une
#                         injection de script étranger est bloquée par le navigateur.
#   form-action 'self' .. un formulaire ne peut jamais poster ailleurs que chez nous.
#   frame-ancestors ..... le site ne peut pas être enfermé dans la page d'un tiers
#                         (technique classique d'hameçonnage par recouvrement).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://rip.parisconseils.fr https://images.unsplash.com; connect-src 'self' https://rip.parisconseils.fr https://api-adresse.data.gouv.fr; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ==== Cache long-terme pour assets statiques ====
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ==== HTML : cache court + revalidation (une correction est visible immédiatement) ====
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ==== Redirects (existants) ====
[[redirects]]
  from = "/parrainage"
  to = "/parrainage.html"
  status = 200

[[redirects]]
  from = "/parrainage.html"
  to = "/index.html"
  status = 200
  force = false
